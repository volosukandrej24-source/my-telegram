<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Glass Control — PrivateGram</title>
  <style>
    body { background: radial-gradient(circle at top left, #1e1b4b, #090d16 60%); color: #f8fafc; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
    .glass { background: rgba(20, 28, 43, 0.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 18px; }
    .login-box { max-width: 360px; margin: 90px auto; text-align: center; }
    input, select { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(15, 23, 42, 0.75); color: #fff; font-size: 13px; outline: none; }
    button { padding: 10px 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; font-weight: 600; cursor: pointer; }
    .user-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: center; }
    label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="login-screen" class="glass login-box">
    <h2>🛡 Центр управления</h2>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">Введите мастер-пароль администратора</p>
    <input type="password" id="admin-pass" placeholder="Пароль" style="width:100%;box-sizing:border-box;margin-bottom:12px;" />
    <button onclick="login()" style="width:100%;">Войти в систему</button>
  </div>

  <div id="panel" style="display:none;max-width:1200px;margin:0 auto;">
    <h1>👑 PrivateGram Admin Dashboard</h1>

    <div class="glass">
      <h3>📢 Глобальная рассылка в Telegram-бота</h3>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <input type="text" id="b-text" placeholder="Сообщение всем пользователям в ТГ..." style="flex:1;" />
        <button onclick="broadcast()">Отправить</button>
      </div>
    </div>

    <div class="glass">
      <h3>👥 Пользователи, NFT, Подарки и Верификация</h3>
      <div id="users-list" style="margin-top:14px;"></div>
    </div>

    <div class="glass">
      <h3>📡 Верификация каналов</h3>
      <div id="channels-list" style="margin-top:14px;"></div>
    </div>
  </div>
  <script>
  let token = '', giftsList = [];

  async function login() {
    const password = document.getElementById('admin-pass').value;
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    if (!res.ok) return alert('Неверный пароль!');
    token = password;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadAll();
  }

  async function loadAll() {
    const res = await fetch('/api/admin/data', { headers: { 'x-admin-token': token } });
    const data = await res.json();
    giftsList = data.gifts;
    const uBox = document.getElementById('users-list'); uBox.innerHTML = '';
    data.users.forEach(u => {
      const opts = giftsList.map(g => `<option value="${g.id}">${g.emoji} ${g.name}</option>`).join('');
      const div = document.createElement('div'); div.className = 'user-card';
      div.innerHTML = `
        <div><label>ID #${u.id} • ${u.first_name}</label><input id="ph_${u.id}" value="${u.phone}" style="width:100%;"></div>
        <div><label>Username</label><input id="us_${u.id}" value="${u.username || ''}" placeholder="без @" style="width:100%;"></div>
        <div><label>Звёзды ⭐️</label><input type="number" id="st_${u.id}" value="${u.stars_balance}" style="width:100%;"></div>
        <div><label>Выдать NFT-юз</label><input id="nu_${u.id}" placeholder="@vip" style="width:100%;"></div>
        <div><label>Выдать NFT-номер</label><input id="nn_${u.id}" placeholder="+88899999999" style="width:100%;"></div>
        <div><label>Подарить NFT</label><select id="gf_${u.id}" style="width:100%;"><option value="">— Нет —</option>${opts}</select></div>
        <div style="display:flex;gap:10px;font-size:12px;">
          <label><input type="checkbox" id="ver_${u.id}" ${u.is_verified ? 'checked' : ''}> ✓</label>
          <label><input type="checkbox" id="prem_${u.id}" ${u.is_premium ? 'checked' : ''}> ★</label>
          <label><input type="checkbox" id="ban_${u.id}" ${u.is_banned ? 'checked' : ''}> Бан</label>
        </div>
        <div><button onclick="saveUser(${u.id})" style="width:100%;">💾 Сохранить</button></div>
      `;
      uBox.appendChild(div);
    });

    const cBox = document.getElementById('channels-list'); cBox.innerHTML = '';
    data.channels.forEach(ch => {
      const div = document.createElement('div'); div.className = 'user-card';
      div.innerHTML = `<div><strong>${ch.title}</strong> (${ch.username ? '@' + ch.username : 'без юза'})</div><div><label><input type="checkbox" ${ch.is_verified ? 'checked' : ''} onchange="verifyChannel(${ch.id}, this.checked)"> Галочка канала ✓</label></div>`;
      cBox.appendChild(div);
    });
  }

  async function saveUser(id) {
    await fetch('/api/admin/update-user', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: JSON.stringify({
        id, phone: document.getElementById(`ph_${id}`).value, username: document.getElementById(`us_${id}`).value,
        stars_balance: parseInt(document.getElementById(`st_${id}`).value) || 0, add_nft_user: document.getElementById(`nu_${id}`).value.trim(),
        add_nft_num: document.getElementById(`nn_${id}`).value.trim(), add_gift_id: document.getElementById(`gf_${id}`).value,
        is_verified: document.getElementById(`ver_${id}`).checked, is_premium: document.getElementById(`prem_${id}`).checked, is_banned: document.getElementById(`ban_${id}`).checked
      })
    });
    alert('Сохранено!'); loadAll();
  }

  async function verifyChannel(id, is_verified) {
    await fetch('/api/admin/verify-channel', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ id, is_verified }) });
  }

  async function broadcast() {
    const text = document.getElementById('b-text').value; if (!text) return;
    const res = await fetch('/api/admin/broadcast', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': token }, body: JSON.stringify({ text }) });
    const d = await res.json(); alert(`Отправлено: ${d.sent}`); document.getElementById('b-text').value = '';
  }
</script>
</body>
</html>
